name: Build XiaoZhi AI Pet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Auto-Generate Android Wrapper
        run: |
          mkdir -p /tmp/backup/lib
          cp pubspec.yaml /tmp/backup/
          cp -r lib/* /tmp/backup/lib/

          flutter create --platforms=android --org id.xiaozhi.aipet --project-name xiaozhi_pet .

          cp /tmp/backup/pubspec.yaml .
          cp -r /tmp/backup/lib/* lib/

      - name: Configure Android Manifest, SDK 35 & Root Gradle Patch
        run: |
          python3 -c '
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()
          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          """
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permissions + "\n    <application", 1)
          content = content.replace("android:label=\"xiaozhi_pet\"", "android:label=\"XiaoZhi AI Pet\"")
          with open(manifest_path, "w") as f:
              f.write(content)

          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              g = f.read()
          g = g.replace("flutter.minSdkVersion", "23")
          with open(gradle_path, "w") as f:
              f.write(g)

          root_gradle = "android/build.gradle"
          with open(root_gradle, "r") as f:
              rg = f.read()
          if "subprojects {" not in rg:
              rg += """
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty(\x27android\x27)) {
                      project.android {
                          if (namespace == null) {
                              namespace project.group
                          }
                          compileSdk = 35
                          defaultConfig {
                              minSdk = 23
                              targetSdk = 35
                          }
                      }
                  }
              }
          }
          """
              with open(root_gradle, "w") as f:
                  f.write(rg)
          '

      - name: Build Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk xiaozhi-ai-pet.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-AI-Pet-APK
          path: xiaozhi-ai-pet.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "XiaoZhi AI Pet - Pure XiaoZhi Edition"
          body: "Download langsung file **xiaozhi-ai-pet.apk** di bawah ini."
          files: xiaozhi-ai-pet.apk
          prerelease: false
