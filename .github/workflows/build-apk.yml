name: Build XiaoZhi AI Pet APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.27
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Auto-Generate Android Wrapper
        run: |
          mkdir -p /tmp/backup/lib
          cp pubspec.yaml /tmp/backup/
          cp -r lib/* /tmp/backup/lib/

          flutter create --platforms=android --org id.xiaozhi.aipet --project-name xiaozhi_pet .

          cp /tmp/backup/pubspec.yaml .
          cp -r /tmp/backup/lib/* lib/

      - name: Fetch Dependencies
        run: flutter pub get

      - name: Patch Android SDK 35, Native GPS, NDK & Plugin Pub-Cache
        run: |
          python3 - << 'EOF'
          import os
          import re

          # 1. Suntikkan Permission GPS, Kamera, Mic ke AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r") as f:
              content = f.read()
          permissions = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          """
          if "android.permission.INTERNET" not in content:
              content = content.replace("<application", permissions + "\n    <application", 1)
          content = content.replace('android:label="xiaozhi_pet"', 'android:label="XiaoZhi AI Pet"')
          with open(manifest_path, "w") as f:
              f.write(content)

          # 2. Suntikkan Native Hardware GPS & Audio Volume ke MainActivity.kt
          for root, dirs, files in os.walk("android/app/src/main/kotlin"):
              if "MainActivity.kt" in files:
                  kt_path = os.path.join(root, "MainActivity.kt")
                  with open(kt_path, "r") as f:
                      first_line = f.readline().strip()
                  kt_code = f"""{first_line}

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.media.AudioManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {{
              private val CHANNEL = "id.xiaozhi.aipet/native"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {{
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler {{ call, result ->
                      when (call.method) {{
                          "getGps" -> getGpsCoordinates(result)
                          "setVolume" -> {{
                              val level = call.argument<Int>("level") ?: 80
                              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              val max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                              val target = (level.coerceIn(0, 100) * max) / 100
                              am.setStreamVolume(AudioManager.STREAM_MUSIC, target, 0)
                              result.success(level)
                          }}
                          "getVolume" -> {{
                              val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                              val max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                              val cur = am.getStreamVolume(AudioManager.STREAM_MUSIC)
                              val pct = if (max > 0) (cur * 100) / max else 80
                              result.success(pct)
                          }}
                          else -> result.notImplemented()
                      }}
                  }}
              }}

              private fun getGpsCoordinates(result: MethodChannel.Result) {{
                  try {{
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {{
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED &&
                              checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {{
                              requestPermissions(arrayOf(Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION), 101)
                              result.error("PERM", "Permission requested", null)
                              return
                          }}
                      }}
                      val lm = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                      val providers = lm.getProviders(true)
                      var bestLocation: Location? = null
                      for (provider in providers) {{
                          val l = lm.getLastKnownLocation(provider) ?: continue
                          if (bestLocation == null || l.accuracy < bestLocation.accuracy) {{
                              bestLocation = l
                          }}
                      }}
                      if (bestLocation != null) {{
                          result.success(mapOf("lat" to bestLocation.latitude, "lon" to bestLocation.longitude))
                      }} else {{
                          val provider = if (lm.isProviderEnabled(LocationManager.GPS_PROVIDER)) LocationManager.GPS_PROVIDER else LocationManager.NETWORK_PROVIDER
                          var answered = false
                          val listener = object : LocationListener {{
                              override fun onLocationChanged(loc: Location) {{
                                  if (!answered) {{
                                      answered = true
                                      lm.removeUpdates(this)
                                      result.success(mapOf("lat" to loc.latitude, "lon" to loc.longitude))
                                  }}
                              }}
                              override fun onStatusChanged(p: String?, s: Int, e: Bundle?) {{}}
                              override fun onProviderEnabled(p: String) {{}}
                              override fun onProviderDisabled(p: String) {{}}
                          }}
                          lm.requestLocationUpdates(provider, 0L, 0f, listener, Looper.getMainLooper())
                          Handler(Looper.getMainLooper()).postDelayed({{
                              if (!answered) {{
                                  answered = true
                                  lm.removeUpdates(listener)
                                  result.error("TIMEOUT", "GPS timeout", null)
                              }}
                          }}, 4500)
                      }}
                  }} catch (e: Exception) {{
                      result.error("ERR", e.message, null)
                  }}
              }}
          }}
          """
                  with open(kt_path, "w") as f:
                      f.write(kt_code)

          # 3. Tambahkan toleransi JVM target di gradle.properties
          prop_path = "android/gradle.properties"
          with open(prop_path, "a") as f:
              f.write("\nkotlin.jvm.target.validation.mode=warning\n")

          # 4. Set SDK 35, minSdk 23, dan NDK di android/app/build.gradle
          gradle_path = "android/app/build.gradle"
          with open(gradle_path, "r") as f:
              g = f.read()
          g = g.replace("flutter.compileSdkVersion", "35")
          g = g.replace("flutter.targetSdkVersion", "35")
          g = g.replace("flutter.minSdkVersion", "23")
          g = g.replace("flutter.ndkVersion", '"25.1.8937393"')
          with open(gradle_path, "w") as f:
              f.write(g)

          # 5. Tambal seluruh build.gradle & record_linux.dart di ~/.pub-cache
          pub_cache = os.path.expanduser("~/.pub-cache")
          for root, dirs, files in os.walk(pub_cache):
              if "record_linux.dart" in files:
                  rl_path = os.path.join(root, "record_linux.dart")
                  try:
                      with open(rl_path, "r") as f:
                          rl = f.read()
                      if "noSuchMethod" not in rl:
                          rl = rl.replace(
                              "class RecordLinux extends RecordPlatform {",
                              "class RecordLinux extends RecordPlatform {\n  @override\n  dynamic noSuchMethod(Invocation i) => super.noSuchMethod(i);"
                          )
                          rl = rl.replace(
                              "Future<bool> hasPermission(String recorderId)",
                              "Future<bool> hasPermission(String recorderId, {bool request = true})"
                          )
                          with open(rl_path, "w") as f:
                              f.write(rl)
                  except Exception:
                      pass

              if "build.gradle" in files:
                  bg_path = os.path.join(root, "build.gradle")
                  try:
                      with open(bg_path, "r") as f:
                          bg = f.read()
                      orig = bg
                      bg = bg.replace("flutter.compileSdkVersion", "35")
                      bg = bg.replace("flutter.targetSdkVersion", "35")
                      bg = bg.replace("flutter.minSdkVersion", "23")
                      bg = bg.replace("flutter.ndkVersion", '"25.1.8937393"')

                      if "com.android.library" in bg and "namespace" not in bg:
                          manifest_cand = os.path.join(root, "src", "main", "AndroidManifest.xml")
                          if os.path.exists(manifest_cand):
                              with open(manifest_cand, "r") as mf:
                                  m_txt = mf.read()
                              m = re.search(r'package\s*=\s*"([^"]+)"', m_txt)
                              if m:
                                  pkg_name = m.group(1)
                                  bg = bg.replace("android {", f'android {{\n    namespace "{pkg_name}"', 1)
                                  m_txt_clean = re.sub(r'\s*package\s*=\s*"[^"]+"', '', m_txt, count=1)
                                  with open(manifest_cand, "w") as mf:
                                      mf.write(m_txt_clean)

                      if bg != orig:
                          with open(bg_path, "w") as f:
                              f.write(bg)
                  except Exception:
                      pass
          EOF

      - name: Build Release APK
        run: |
          flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk xiaozhi-ai-pet.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XiaoZhi-AI-Pet-APK
          path: xiaozhi-ai-pet.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "XiaoZhi AI Pet - Full GPS, Selfie Vision & 21 Emotions"
          body: "Download langsung file **xiaozhi-ai-pet.apk** di bawah ini."
          files: xiaozhi-ai-pet.apk
          prerelease: false
